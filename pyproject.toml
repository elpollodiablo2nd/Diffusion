[project]
name = "denovo-diffusion-pipeline"
version = "0.1.0"
description = "De novo binder design pipeline: RFdiffusion backbone diffusion -> ProteinMPNN inverse folding -> ColabFold AF2-multimer refolding, with ipAE/pLDDT evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "biopython>=1.83",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
